[package]
name = "noether"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["xtask"]
resolver = "3"

[[bin]]
name = "noet"
path = "src/main.rs"

[[bin]]
name = "noet-bench"
path = "src/bin/noet-bench.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
reqwest = { version = "0.13.3", features = ["json", "stream"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower = "0.5.2"
tower-http = { version = "0.6.10", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-postgres = "0.7"
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v4"] }
open = "5.3"

[dev-dependencies]
tempfile = "3.25.0"

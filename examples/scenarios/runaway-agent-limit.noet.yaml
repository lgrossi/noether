version: 1
name: runaway agent limit
policy:
  version: 0
  budgets:
    - id: runaway-budget
      match:
        project: runaway
      limits:
        spend:
          - id: budget-cap
            by: project
            window: 30d
            mode: tumbling
            anchor:
              kind: first_seen
            max_usd: 50
            action: block
        request_cost:
          max_usd: 1.0
          action: block
requests:
  - id: req-1
    authorize:
      subject: user:loop
      project: runaway
      provider: openai
      model: gpt-4.1
      estimated_cost_usd: 2.5
      entities: [project:runaway, user:loop]
    denial:
      rule_id: runaway-budget.request_cost
      reason_contains: exceeds enforced limit max
assertions:
  - kind: denied
    request_id: req-1
  - kind: limit_hit
    request_id: req-1
    rule_id: runaway-budget.request_cost
  - kind: report_contains
    report: decisions
    text: limit_hits=runaway-budget.request_cost
  - kind: dashboard_contains
    text: Risky runs

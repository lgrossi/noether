version: 1
name: hybrid budget pacing windows
policy:
  version: 0
  budgets:
    - id: personal-primary
      match: {}
      limits:
        spend:
          - id: budget-cap
            by: global
            window: 30d
            mode: tumbling
            anchor:
              kind: first_seen
            max_usd: 1000
            warn_at_fraction: 0.8
            action: block
          - id: daily-cap
            by: user
            window: 1d
            mode: tumbling
            anchor:
              kind: first_seen
            max_usd: 100
            action: block
          - id: spike-5m
            by: user
            window: 5m
            mode: rolling
            max_usd: 40
            action: block
entities: [project:noether, user:alice]
requests:
  - id: req-1
    authorize:
      project: noether
      provider: openai
      model: gpt-4.1
      estimated_cost_usd: 30
  - id: req-2
    authorize:
      project: noether
      provider: openai
      model: gpt-4.1
      estimated_cost_usd: 15
    denial:
      rule_id: personal-primary.spend_window.spike-5m
      reason_contains: enforced 5m limit
  - id: req-3
    authorize:
      project: noether
      provider: openai
      model: gpt-4.1
      estimated_cost_usd: 71
    denial:
      rule_id: personal-primary.spend_window.daily-cap
      reason_contains: enforced 1d limit
assertions:
  - kind: decision_outcome
    request_id: req-1
    outcome: allow
  - kind: denied
    request_id: req-2
  - kind: limit_hit
    request_id: req-2
    rule_id: personal-primary.spend_window.spike-5m
  - kind: denied
    request_id: req-3
  - kind: limit_hit
    request_id: req-3
    rule_id: personal-primary.spend_window.daily-cap
  - kind: report_json
    report: decisions
    pointer: /0/limit_hits/0/window_mode
    equals: tumbling
  - kind: report_json
    report: decisions
    pointer: /1/limit_hits/0/window_mode
    equals: rolling
  - kind: report_json
    report: decisions
    pointer: /2/routing/budget_window_mode
    equals: tumbling

version: 1
name: local developer
policy:
  version: 0
  budgets:
    - id: project-noether
      limits:
        spend:
          - id: budget-cap
            window: 30d
            mode: tumbling
            anchor:
              kind: first_seen
            max_usd: 25
            action: block
      eligible:
        entities: [project:noether]
entities: [project:noether, user:alice]
requests:
  - id: req-1
    authorize:
      subject: user:alice
      project: noether
      provider: openai
      model: gpt-4.1
      estimated_tokens: 1200
    model_choice:
      provider: openai
      model: gpt-4.1
    tool_activity:
      - name: bash
        success: true
        duration_ms: 42
    finalize:
      actual_cost_usd: 0.002
      usage:
        provider: openai
        model: gpt-4.1
        input_tokens: 700
        output_tokens: 300
        total_tokens: 1000
        cost_usd: 0.002
assertions:
  - kind: decision_outcome
    request_id: req-1
    outcome: allow
  - kind: selected_budget
    request_id: req-1
    budget_id: project-noether
  - kind: total_cost_usd
    amount_usd: 0.002
  - kind: report_json
    report: usage
    pointer: /rows/0/project
    equals: noether
  - kind: report_contains
    report: decisions
    text: selected_budget=project-noether
  - kind: dashboard_contains
    text: name=bash success=true

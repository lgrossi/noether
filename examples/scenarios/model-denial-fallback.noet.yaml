version: 1
name: model denial fallback
policy:
  version: 0
  budgets:
    - id: restricted-claude
      limits:
        spend:
          - id: budget-cap
            by: project
            window: 30d
            mode: tumbling
            anchor:
              kind: first_seen
            max_usd: 10
            action: block
      match:
        project: noether
      models:
        allow:
          - anthropic:claude-sonnet-*
    - id: openai-project
      limits:
        spend:
          - id: budget-cap
            by: project
            window: 30d
            mode: tumbling
            anchor:
              kind: first_seen
            max_usd: 25
            action: block
      match:
        project: noether
      models:
        allow:
          - openai:*
requests:
  - id: req-1
    authorize:
      budget_id: restricted-claude
      subject: user:alice
      project: noether
      provider: openai
      model: gpt-4.1
      estimated_cost_usd: 0.002
      entities: [project:noether, user:alice]
    finalize:
      actual_cost_usd: 0.0018
      usage:
        provider: openai
        model: gpt-4.1
        input_tokens: 800
        output_tokens: 260
        total_tokens: 1060
        cost_usd: 0.0018
    fallback:
      requested_budget_id: restricted-claude
      selected_budget_id: openai-project
      matched_entity: project:noether
assertions:
  - kind: decision_outcome
    request_id: req-1
    outcome: allow
  - kind: fallback
    request_id: req-1
    requested_budget_id: restricted-claude
    selected_budget_id: openai-project
    matched_entity: project:noether
  - kind: report_contains
    report: decisions
    text: rejected_reason=requested
  - kind: report_contains
    report: decisions
    text: model_check=denied

models:
  - id: flagship
    provider: openai
    model: gpt-4.1
    cost_per_1k_tokens_usd: 0.05
  - id: fast
    provider: openai
    model: gpt-4.1-mini
    cost_per_1k_tokens_usd: 0.01
strategies:
  - id: pooled cap
    description: Heavy users spend from one shared cap, and underuse is invisible.
    policy:
      version: 0
      budgets:
        - id: eng-pooled
          limits:
            spend:
              - id: budget-cap
                window: 30d
                mode: tumbling
                anchor:
                  kind: first_seen
                max_usd: 4
                action: block
          eligible:
            entities: [team:eng]
  - id: protected adoption
    description: Protected per-user budget surfaces low adopters and preserves explicit opportunity.
    policy:
      version: 0
      budgets:
        - id: eng-adoption
          limits:
            spend:
              - id: budget-cap
                window: 30d
                mode: tumbling
                anchor:
                  kind: first_seen
                max_usd: 4
                action: block
          eligible:
            entities: [team:eng]
          allocation:
            standard: protected_adoption_pool
            by: user
            protected_amount_usd: 0.4
            window: monthly
            carryover:
              percent: 0
              cap_usd: 0

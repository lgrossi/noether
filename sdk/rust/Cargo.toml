[package]
name = "noether-sidecar"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
noether = { path = "../.." }
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["time"] }
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time"] }
tower = "0.5.2"

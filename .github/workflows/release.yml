name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar
          - os: macos-14
            target: macos-aarch64
            archive: tar
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag
        run: cargo run -p xtask -- release check "${{ github.ref_name }}"
      - name: Build release binary
        run: cargo build --locked --release --bin noet
      - name: Smoke test noet
        shell: bash
        run: |
          set -euo pipefail
          BIN="./target/release/noet"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="./target/release/noet.exe"
          fi
          "$BIN" --version
          "$BIN" --help
          "$BIN" policy check examples/policy.noet.yaml
      - name: Package Unix artifact
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          package="noether-${tag}-${target}"
          mkdir -p "dist/${package}/examples"
          cp target/release/noet "dist/${package}/noet"
          cp README.md "dist/${package}/README.md"
          cp examples/policy.noet.yaml "dist/${package}/examples/policy.noet.yaml"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          cp target/release/noet "dist/noet-${tag}-${target}"
      - name: Package Windows artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $target = "${{ matrix.target }}"
          $package = "noether-$tag-$target"
          New-Item -ItemType Directory -Force -Path "dist/$package/examples" | Out-Null
          Copy-Item "target/release/noet.exe" "dist/$package/noet.exe"
          Copy-Item "README.md" "dist/$package/README.md"
          Copy-Item "examples/policy.noet.yaml" "dist/$package/examples/policy.noet.yaml"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip"
          Copy-Item "target/release/noet.exe" "dist/noet-$tag-$target.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/noet-*

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and update manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          assets=()
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            target="${name#noet-${tag}-}"
            target="${target%.exe}"
            sha="$(sha256sum "$file" | awk '{print $1}')"
            assets+=(--asset "target=${target},kind=binary,file=${name},sha256=${sha}")
          done < <(find dist -maxdepth 1 -type f -name "noet-${tag}-*" -print0 | sort -z)

          cargo run -p xtask -- release manifest \
            --version "$tag" \
            --out dist/noether-release.json \
            "${assets[@]}"

          (
            cd dist
            sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort) > SHA256SUMS
          )
      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Noether

          Preview release of the Noether core `noet` binary.

          This release publishes Linux x86_64, macOS arm64, and Windows x86_64 binaries,
          checksums, and the machine-readable `noether-release.json` manifest used by
          `noet update`.

          SDKs and harness extensions are included in the source repository but are not published
          as package-registry artifacts by this release.
          EOF
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Noether ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --verify-tag

  container:
    name: publish container image
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest-preview
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

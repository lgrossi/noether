<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Noether README hero</title>
  <desc id="desc">README hero banner for Noether using the invariant seal icon, wordmark, and workflow-native governance framing.</desc>
  <defs>
    <radialGradient id="bgHero" cx="22%" cy="18%" r="90%">
      <stop offset="0" stop-color="#182341"/>
      <stop offset="0.48" stop-color="#0b1221"/>
      <stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <radialGradient id="panelGlow" cx="28%" cy="35%" r="60%">
      <stop offset="0" stop-color="#1d2d56" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d2d56" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalHero" x1="220" y1="150" x2="640" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f3ea"/>
      <stop offset="0.24" stop-color="#e6d8c3"/>
      <stop offset="0.5" stop-color="#b5c0f4"/>
      <stop offset="0.76" stop-color="#8777d7"/>
      <stop offset="1" stop-color="#f2ece2"/>
    </linearGradient>
    <linearGradient id="wordHero" x1="760" y1="180" x2="1260" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf6ed"/>
      <stop offset="0.42" stop-color="#ddd6ca"/>
      <stop offset="1" stop-color="#b7c3ef"/>
    </linearGradient>
    <linearGradient id="lineHero" x1="690" y1="560" x2="1450" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d3d67"/>
      <stop offset="0.5" stop-color="#6975b3"/>
      <stop offset="1" stop-color="#32284b"/>
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="softTextShadow" x="-10%" y="-10%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="22" y="22" width="1556" height="856" rx="56" fill="url(#bgHero)"/>
  <rect x="24" y="24" width="1552" height="852" rx="54" fill="none" stroke="#213052" stroke-width="4" opacity="0.9"/>

  <circle cx="328" cy="318" r="340" fill="url(#panelGlow)"/>
  <path d="M 40 180 C 180 108 304 114 392 188 C 476 258 538 286 640 280" fill="none" stroke="#27385f" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 52 694 C 200 760 328 746 430 668 C 520 598 574 560 656 556" fill="none" stroke="#2b3154" stroke-width="8" stroke-linecap="round" opacity="0.56"/>
  <path d="M 910 154 C 1070 106 1248 124 1468 242" fill="none" stroke="#243456" stroke-width="5" stroke-linecap="round" opacity="0.44"/>
  <path d="M 848 770 C 1030 708 1224 716 1510 820" fill="none" stroke="#2b2746" stroke-width="5" stroke-linecap="round" opacity="0.44"/>

  <g transform="translate(108 124) scale(0.66)" filter="url(#heroShadow)">
    <circle cx="512" cy="468" r="358" fill="#0d1424" opacity="0.62"/>

    <path
      d="M 512 122 L 760 266 L 760 758 L 512 902 L 264 758 L 264 266 Z
         M 512 188 L 702 298 L 702 726 L 512 836 L 322 726 L 322 298 Z"
      fill="#0d1424"
      fill-rule="evenodd"
      stroke="url(#metalHero)"
      stroke-width="12"
      stroke-linejoin="round"/>

    <path d="M 512 154 L 732 282 L 732 742 L 512 870 L 292 742 L 292 282 Z"
      fill="none"
      stroke="#12192c"
      stroke-width="34"
      stroke-linejoin="round"
      opacity="0.78"/>

    <path d="M 512 178 L 512 846"
      fill="none"
      stroke="#12192c"
      stroke-width="34"
      stroke-linecap="round"
      opacity="0.76"/>
    <path d="M 512 178 L 512 846"
      fill="none"
      stroke="url(#metalHero)"
      stroke-width="24"
      stroke-linecap="round"/>
    <path d="M 512 178 L 512 846"
      fill="none"
      stroke="#fbf7ef"
      stroke-width="7"
      stroke-linecap="round"
      opacity="0.72"/>

    <path d="M 330 290 C 264 346 232 424 232 512 C 232 600 264 678 330 734"
      fill="none"
      stroke="#131a2d"
      stroke-width="76"
      stroke-linecap="round"
      opacity="0.82"/>
    <path d="M 694 290 C 760 346 792 424 792 512 C 792 600 760 678 694 734"
      fill="none"
      stroke="#131a2d"
      stroke-width="76"
      stroke-linecap="round"
      opacity="0.82"/>

    <path d="M 330 290 C 264 346 232 424 232 512 C 232 600 264 678 330 734"
      fill="none"
      stroke="url(#metalHero)"
      stroke-width="58"
      stroke-linecap="round"/>
    <path d="M 694 290 C 760 346 792 424 792 512 C 792 600 760 678 694 734"
      fill="none"
      stroke="url(#metalHero)"
      stroke-width="58"
      stroke-linecap="round"/>

    <path d="M 380 324 C 430 404 468 460 512 512"
      fill="none"
      stroke="url(#metalHero)"
      stroke-width="18"
      stroke-linecap="round"/>
    <path d="M 644 324 C 594 404 556 460 512 512"
      fill="none"
      stroke="url(#metalHero)"
      stroke-width="18"
      stroke-linecap="round"/>
    <path d="M 380 700 C 430 620 468 564 512 512"
      fill="none"
      stroke="url(#metalHero)"
      stroke-width="18"
      stroke-linecap="round"/>
    <path d="M 644 700 C 594 620 556 564 512 512"
      fill="none"
      stroke="url(#metalHero)"
      stroke-width="18"
      stroke-linecap="round"/>

    <circle cx="512" cy="512" r="86" fill="#0b1120" stroke="url(#metalHero)" stroke-width="18"/>
    <circle cx="512" cy="512" r="46" fill="#06080d" stroke="#f7f1e8" stroke-width="10"/>
    <circle cx="512" cy="512" r="12" fill="#8a7fff"/>
  </g>

  <g filter="url(#softTextShadow)">
    <text x="676" y="304" fill="url(#wordHero)" font-family="Georgia, 'Times New Roman', serif" font-size="124" font-weight="700" letter-spacing="-4">Noether</text>
    <text x="680" y="364" fill="#c4d0ef" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" letter-spacing="4.1">NOT A PROXY. THE LOCAL-FIRST GOVERNANCE LAYER</text>
    <text x="680" y="398" fill="#c4d0ef" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" letter-spacing="4.1">FOR AI WORKFLOWS</text>
    <text x="680" y="466" fill="#d6dff0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500">
      Work natively with the setup you already use:
    </text>
    <text x="680" y="506" fill="#d6dff0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500">
      harness, gateway, subscription, or API.
    </text>
    <text x="680" y="554" fill="#98aacd" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="450">
      Policy. Attribution. Approval. Simulation. Privacy by default.
    </text>
  </g>

  <path d="M 680 596 H 1444" stroke="url(#lineHero)" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(680 642)">
      <rect x="0" y="0" width="162" height="46" rx="23" fill="#0f1b32" stroke="#2f4b77"/>
      <text x="28" y="30" fill="#f4efe5" font-size="18" font-weight="700" letter-spacing="1.8">OBSERVE</text>
    </g>
    <g transform="translate(858 642)">
      <rect x="0" y="0" width="172" height="46" rx="23" fill="#14162b" stroke="#4d4780"/>
      <text x="26" y="30" fill="#f4efe5" font-size="18" font-weight="700" letter-spacing="1.8">ATTRIBUTE</text>
    </g>
    <g transform="translate(1046 642)">
      <rect x="0" y="0" width="160" height="46" rx="23" fill="#161625" stroke="#6c63aa"/>
      <text x="30" y="30" fill="#f4efe5" font-size="18" font-weight="700" letter-spacing="1.8">CONTROL</text>
    </g>
    <g transform="translate(1224 642)">
      <rect x="0" y="0" width="152" height="46" rx="23" fill="#171320" stroke="#8c7cd4"/>
      <text x="32" y="30" fill="#f4efe5" font-size="18" font-weight="700" letter-spacing="1.8">IMPROVE</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(680 748)">
      <circle cx="16" cy="16" r="6" fill="#e6d8c3"/>
      <text x="34" y="24" fill="#e2e8f6" font-size="20" font-weight="650" letter-spacing="1.2">BEFORE SPEND</text>
      <text x="34" y="54" fill="#98aacd" font-size="16" font-weight="500">Decide before spend lands.</text>
    </g>
    <g transform="translate(948 748)">
      <circle cx="16" cy="16" r="6" fill="#b5c0f4"/>
      <text x="34" y="24" fill="#e2e8f6" font-size="20" font-weight="650" letter-spacing="1.2">AFTER SPEND</text>
      <text x="34" y="54" fill="#98aacd" font-size="16" font-weight="500">Reconcile traces and attribution.</text>
    </g>
    <g transform="translate(1208 748)">
      <circle cx="16" cy="16" r="6" fill="#8777d7"/>
      <text x="34" y="24" fill="#e2e8f6" font-size="20" font-weight="650" letter-spacing="1.2">FOR TEAMS</text>
      <text x="34" y="54" fill="#98aacd" font-size="16" font-weight="500">Keep governance explainable.</text>
    </g>
  </g>
</svg>
